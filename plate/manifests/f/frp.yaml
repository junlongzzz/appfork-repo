name: frp
author: fatedier <fatedier@gmail.com>
homepage: https://github.com/fatedier/frp
description: A fast reverse proxy to help you expose a local server behind a NAT or firewall to the internet.
categories:
  - network
platforms:
  windows:
    version: 0.72.0
    url:
      frp_0.72.0_windows_amd64.zip: https://github.com/fatedier/frp/releases/download/v0.72.0/frp_0.72.0_windows_amd64.zip
      frp_0.72.0_windows_arm64.zip: https://github.com/fatedier/frp/releases/download/v0.72.0/frp_0.72.0_windows_arm64.zip
script:
  args:
    url: gh://fatedier/frp
    autoupdate:
      frp_${version}_windows_amd64.zip: https://github.com/fatedier/frp/releases/download/v${version}/frp_${version}_windows_amd64.zip
      frp_${version}_windows_arm64.zip: https://github.com/fatedier/frp/releases/download/v${version}/frp_${version}_windows_arm64.zip
  name: appfork-check-update
