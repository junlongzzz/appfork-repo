name: Fast Node Manager (fnm)
author: Gal Schlezinger <gal@spitfire.co.il>
homepage: https://github.com/Schniz/fnm
description: 🚀 Fast and simple Node.js version manager, built in Rust
categories:
  - development
platforms:
  windows:
    version: 1.39.0
    url:
      - https://github.com/Schniz/fnm/releases/download/v1.39.0/fnm-windows.zip
script:
  name: appfork-check-update
  args:
