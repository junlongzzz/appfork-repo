name: Eclipse Temurin JDK 11
author: Eclipse Adoptium
homepage: https://adoptium.net/
description: Eclipse Temurin JDK 11 (LTS) - 开源免费的 Java 开发工具包，基于 OpenJDK 构建
logo: https://adoptium.net/images/adoptium-icon.png
categories:
  - development
platforms:
  linux:
    version: 11.0.33.1+1
    url:
      OpenJDK11U-jdk_aarch64_linux_hotspot_11.0.33.1_1.tar.gz: https://github.com/adoptium/temurin11-binaries/releases/download/jdk-11.0.33.1%2B1/OpenJDK11U-jdk_aarch64_linux_hotspot_11.0.33.1_1.tar.gz
      OpenJDK11U-jdk_x64_linux_hotspot_11.0.33.1_1.tar.gz: https://github.com/adoptium/temurin11-binaries/releases/download/jdk-11.0.33.1%2B1/OpenJDK11U-jdk_x64_linux_hotspot_11.0.33.1_1.tar.gz
    script:
      args:
        url: github://adoptium/temurin11-binaries
        regex: '"tag_name":\s*"jdk-(?<version>[^"]+)"'
        gh:
          assets_jsonpath: $.assets[?(@.name =~ /OpenJDK11U-jdk_(x64|aarch64)_linux_hotspot_[\d._]+\.tar\.gz$/i)]
      name: appfork-check-update
  windows:
    version: 11.0.33.1+1
    url:
      OpenJDK11U-jdk_x64_windows_hotspot_11.0.33.1_1.msi: https://github.com/adoptium/temurin11-binaries/releases/download/jdk-11.0.33.1%2B1/OpenJDK11U-jdk_x64_windows_hotspot_11.0.33.1_1.msi
      OpenJDK11U-jdk_x64_windows_hotspot_11.0.33.1_1.zip: https://github.com/adoptium/temurin11-binaries/releases/download/jdk-11.0.33.1%2B1/OpenJDK11U-jdk_x64_windows_hotspot_11.0.33.1_1.zip
    script:
      args:
        url: github://adoptium/temurin11-binaries
        regex: '"tag_name":\s*"jdk-(?<version>[^"]+)"'
        gh:
          assets_jsonpath: $.assets[?(@.name =~ /OpenJDK11U-jdk_(x64|aarch64)_windows_hotspot_[\d._]+\.(msi|zip)$/i)]
      name: appfork-check-update
