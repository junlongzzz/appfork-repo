name: Eclipse Temurin JDK 25
author: Eclipse Adoptium
homepage: https://adoptium.net/
description: Eclipse Temurin JDK 25 - 开源免费的 Java 开发工具包，基于 OpenJDK 构建
logo: https://adoptium.net/images/adoptium-icon.png
categories:
  - development
platforms:
  linux:
    version: 25.0.5.1+2
    url:
      OpenJDK25U-jdk_x64_linux_hotspot_25.0.5.1_2.tar.gz: https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5.1%2B2/OpenJDK25U-jdk_x64_linux_hotspot_25.0.5.1_2.tar.gz
    script:
      args:
        url: github://adoptium/temurin25-binaries
        regex: '"tag_name":\s*"jdk-(?<version>[^"]+)"'
        gh:
          assets_jsonpath: $.assets[?(@.name =~ /OpenJDK25U-jdk_(x64|aarch64)_linux_hotspot_[\d._]+\.tar\.gz$/i)]
      name: appfork-check-update
  windows:
    version: 25.0.5.1+2
    url:
      OpenJDK25U-jdk_x64_windows_hotspot_25.0.5.1_2.msi: https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5.1%2B2/OpenJDK25U-jdk_x64_windows_hotspot_25.0.5.1_2.msi
      OpenJDK25U-jdk_x64_windows_hotspot_25.0.5.1_2.zip: https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5.1%2B2/OpenJDK25U-jdk_x64_windows_hotspot_25.0.5.1_2.zip
    script:
      args:
        url: github://adoptium/temurin25-binaries
        regex: '"tag_name":\s*"jdk-(?<version>[^"]+)"'
        gh:
          assets_jsonpath: $.assets[?(@.name =~ /OpenJDK25U-jdk_(x64|aarch64)_windows_hotspot_[\d._]+\.(msi|zip)$/i)]
      name: appfork-check-update
