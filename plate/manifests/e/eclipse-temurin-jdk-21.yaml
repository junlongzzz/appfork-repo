name: Eclipse Temurin JDK 21
author: Eclipse Adoptium
homepage: https://adoptium.net/
description: Eclipse Temurin JDK 21 (LTS) - 开源免费的 Java 开发工具包，基于 OpenJDK 构建
logo: https://adoptium.net/images/adoptium-icon.png
categories:
  - development
platforms:
  linux:
    version: 21.0.13+9
    url:
      OpenJDK21U-jdk_aarch64_linux_hotspot_21.0.13_9.tar.gz: https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13%2B9/OpenJDK21U-jdk_aarch64_linux_hotspot_21.0.13_9.tar.gz
      OpenJDK21U-jdk_x64_linux_hotspot_21.0.13_9.tar.gz: https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13%2B9/OpenJDK21U-jdk_x64_linux_hotspot_21.0.13_9.tar.gz
    script:
      args:
        url: github://adoptium/temurin21-binaries
        regex: '"tag_name":\s*"jdk-(?<version>[^"]+)"'
        gh:
          assets_jsonpath: $.assets[?(@.name =~ /OpenJDK21U-jdk_(x64|aarch64)_linux_hotspot_[\d._]+\.tar\.gz$/i)]
      name: appfork-check-update
  windows:
    version: 21.0.13+9
    url:
      OpenJDK21U-jdk_x64_windows_hotspot_21.0.13_9.msi: https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13%2B9/OpenJDK21U-jdk_x64_windows_hotspot_21.0.13_9.msi
      OpenJDK21U-jdk_x64_windows_hotspot_21.0.13_9.zip: https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13%2B9/OpenJDK21U-jdk_x64_windows_hotspot_21.0.13_9.zip
    script:
      args:
        url: github://adoptium/temurin21-binaries
        regex: '"tag_name":\s*"jdk-(?<version>[^"]+)"'
        gh:
          assets_jsonpath: $.assets[?(@.name =~ /OpenJDK21U-jdk_(x64|aarch64)_windows_hotspot_[\d._]+\.(msi|zip)$/i)]
      name: appfork-check-update
