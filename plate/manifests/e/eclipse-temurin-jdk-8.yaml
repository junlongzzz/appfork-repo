name: Eclipse Temurin JDK 8
author: Eclipse Adoptium
homepage: https://adoptium.net/
description: Eclipse Temurin JDK 8 (LTS) - 开源免费的 Java 开发工具包，基于 OpenJDK 构建
logo: https://adoptium.net/images/adoptium-icon.png
categories:
  - development
platforms:
  linux:
    version: jdk8u514-b01
    url:
      OpenJDK8U-jdk_x64_linux_hotspot_8u514b01.tar.gz: https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u514-b01/OpenJDK8U-jdk_x64_linux_hotspot_8u514b01.tar.gz
    script:
      args:
        url: github://adoptium/temurin8-binaries
        regex: '"tag_name":\s*"(?<version>jdk8u[^"]+)"'
        gh:
          assets_jsonpath: $.assets[?(@.name =~ /OpenJDK8U-jdk_(x64|aarch64)_linux_hotspot_[\w]+\.tar\.gz$/i)]
      name: appfork-check-update
  windows:
    version: jdk8u512-b09
    url:
      OpenJDK8U-jdk_x64_windows_hotspot_8u512b09.msi: https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u512-b09/OpenJDK8U-jdk_x64_windows_hotspot_8u512b09.msi
      OpenJDK8U-jdk_x64_windows_hotspot_8u512b09.zip: https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u512-b09/OpenJDK8U-jdk_x64_windows_hotspot_8u512b09.zip
    script:
      args:
        url: github://adoptium/temurin8-binaries
        regex: '"tag_name":\s*"(?<version>jdk8u[^"]+)"'
        gh:
          assets_jsonpath: $.assets[?(@.name =~ /OpenJDK8U-jdk_x64_windows_hotspot_[\w]+\.(msi|zip)$/i)]
      name: appfork-check-update
