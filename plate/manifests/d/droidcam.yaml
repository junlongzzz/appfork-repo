name: DroidCam
author: dev47apps
homepage: https://www.dev47apps.com
description: DroidCam turns your phone/tablet into a webcam for your PC. Use it with chat programs like Zoom, MS Teams, and Skype.
logo: https://files.dev47apps.net/img/app_icon.png
categories:
  - tools
platforms:
  linux:
    version: 2.1.7
    url:
      droidcam_2.1.7.zip: https://files.dev47apps.net/linux/droidcam_2.1.7.zip
      Android App on Google Play: https://play.google.com/store/apps/developer?id=Dev47Apps
      iOS App on App Store: https://apps.apple.com/us/app/droidcam-wireless-webcam/id1510258102
    script:
      args:
        autoupdate:
          droidcam_${version}.zip: https://files.dev47apps.net/linux/droidcam_${version}.zip
          Android App on Google Play: https://play.google.com/store/apps/developer?id=Dev47Apps
          iOS App on App Store: https://apps.apple.com/us/app/droidcam-wireless-webcam/id1510258102
        url: gh://dev47apps/droidcam
      name: appfork-check-update
  windows:
    version: 6.5.3
    url:
      DroidCam.Setup.6.5.3.exe: https://files.dev47apps.net/win/DroidCam.Setup.6.5.3.exe
      Android App on Google Play: https://play.google.com/store/apps/developer?id=Dev47Apps
      iOS App on App Store: https://apps.apple.com/us/app/droidcam-wireless-webcam/id1510258102
    script:
      args:
        regex: win-([\d.]+)
        autoupdate:
          DroidCam.Setup.${version}.exe: https://files.dev47apps.net/win/DroidCam.Setup.${version}.exe
          Android App on Google Play: https://play.google.com/store/apps/developer?id=Dev47Apps
          iOS App on App Store: https://apps.apple.com/us/app/droidcam-wireless-webcam/id1510258102
        url: gh://dev47apps/windows-releases
      name: appfork-check-update
