name: Docker Compose
author: Docker Inc.
homepage: https://docs.docker.com/compose/
description: Docker Compose is a tool for running multi-container applications on Docker defined using the Compose file format.
logo: https://raw.githubusercontent.com/docker/compose/main/logo.png
categories:
  - development
platforms:
  linux:
    version: 5.7.1
    url:
      armv6: https://github.com/docker/compose/releases/download/v5.7.1/docker-compose-linux-armv6
      armv7: https://github.com/docker/compose/releases/download/v5.7.1/docker-compose-linux-armv7
      aarch64: https://github.com/docker/compose/releases/download/v5.7.1/docker-compose-linux-aarch64
      x86_64: https://github.com/docker/compose/releases/download/v5.7.1/docker-compose-linux-x86_64
script:
  args:
    autoupdate:
      armv6: https://github.com/docker/compose/releases/download/v${version}/docker-compose-linux-armv6
      armv7: https://github.com/docker/compose/releases/download/v${version}/docker-compose-linux-armv7
      aarch64: https://github.com/docker/compose/releases/download/v${version}/docker-compose-linux-aarch64
      x86_64: https://github.com/docker/compose/releases/download/v${version}/docker-compose-linux-x86_64
    url: gh://docker/compose
  name: appfork-check-update
