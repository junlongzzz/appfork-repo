name: Docker Desktop
author: Docker Inc.
homepage: https://www.docker.com/products/docker-desktop
description: Docker Desktop is an easy-to-install application for your Mac or Windows environment that enables you to build and share containerized applications and microservices.
logo: https://avatars.githubusercontent.com/u/5429470?s=200&v=4
categories:
  - development
platforms:
  linux:
    version: 4.99.0
    url:
      Linux DEB: https://desktop.docker.com/linux/main/amd64/docker-desktop-amd64.deb
      Linux RPM: https://desktop.docker.com/linux/main/amd64/docker-desktop-x86_64.rpm
      Linux Arch: https://desktop.docker.com/linux/main/amd64/docker-desktop-x86_64.pkg.tar.zst
  mac:
    version: 4.99.0
    url:
      Mac with Intel chip: https://desktop.docker.com/mac/main/amd64/Docker.dmg
      Mac with Apple chip: https://desktop.docker.com/mac/main/arm64/Docker.dmg
  windows:
    version: 4.99.0
    url:
      Amd64: https://desktop.docker.com/win/main/amd64/Docker%20Desktop%20Installer.exe
      Arm64: https://desktop.docker.com/win/main/arm64/Docker%20Desktop%20Installer.exe
