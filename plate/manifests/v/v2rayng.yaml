name: v2rayNG
author: 2dust
homepage: https://github.com/2dust/v2rayNG
description: A V2Ray client for Android, support Xray core and v2fly core.
logo: https://raw.githubusercontent.com/2dust/v2rayNG/master/V2rayNG/app/src/main/ic_launcher-web.png
categories:
  - network
platforms:
  android:
    version: 2.3.15
    url:
      v2rayNG_2.3.15_x86_64.apk: https://github.com/2dust/v2rayNG/releases/download/2.3.15/v2rayNG_2.3.15_x86_64.apk
      v2rayNG_2.3.15_x86.apk: https://github.com/2dust/v2rayNG/releases/download/2.3.15/v2rayNG_2.3.15_x86.apk
