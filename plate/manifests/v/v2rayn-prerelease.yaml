      v2rayN-linux-64.zip: https://github.com/2dust/v2rayN/releases/download/8.0.2/v2rayN-linux-64.zip
      v2rayN-linux-arm64-aot.zip: https://github.com/2dust/v2rayN/releases/download/8.0.2/v2rayN-linux-arm64-aot.zip
      v2rayN-linux-arm64-WebAPI-update.zip: https://github.com/2dust/v2rayN/releases/download/8.0.2/v2rayN-linux-arm64-WebAPI-update.zip
