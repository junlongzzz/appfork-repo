      v2rayN-linux-riscv64-WebAPI.zip: https://github.com/2dust/v2rayN/releases/download/8.0.2/v2rayN-linux-riscv64-WebAPI.zip
    script:
      args:
        url: github://2dust/v2rayN
        gh:
          prerelease: true
          assets_jsonpath: $.assets[?(@.name =~ /.*-linux-.*(.zip|.7z)/i)]
