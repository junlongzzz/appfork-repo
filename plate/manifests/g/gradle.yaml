name: Gradle
author: Gradle Inc.
homepage: https://gradle.org
description: Gradle is a build tool with a focus on build automation and support for multi-language development. If in doubt, choose the binary-only version and browse docs and sources online.
logo: https://gradle.org/images/gradle-256x256.png
categories:
  - development
platforms:
  windows:
    version: 9.3.1
    url:
      Binary-only: https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
      Complete-all: https://services.gradle.org/distributions/gradle-9.3.1-all.zip
script:
  args:
    regex: The current Gradle release is version ([\d.]+)
    autoupdate:
      Binary-only: https://services.gradle.org/distributions/gradle-${version}-bin.zip
      Complete-all: https://services.gradle.org/distributions/gradle-${version}-all.zip
    url: https://gradle.org/install/
  name: appfork-check-update
