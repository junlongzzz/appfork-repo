name: Git for Windows
author: An open source project
homepage: https://gitforwindows.org
description: This is Git for Windows, the Windows port of Git.
logo: https://gitforwindows.org/img/gwindows_logo.png
categories:
  - development
platforms:
  windows:
    version: 2.56.1.windows.1
    url:
      Git-2.56.1-64-bit.exe: https://github.com/git-for-windows/git/releases/download/v2.56.1.windows.1/Git-2.56.1-64-bit.exe
      Git-2.56.1-arm64.exe: https://github.com/git-for-windows/git/releases/download/v2.56.1.windows.1/Git-2.56.1-arm64.exe
      Git-2.56.1-mingw64.exe: https://github.com/git-for-windows/git/releases/download/v2.56.1.windows.1/Git-2.56.1-mingw64.exe
      PortableGit-2.56.1-64-bit.7z.exe: https://github.com/git-for-windows/git/releases/download/v2.56.1.windows.1/PortableGit-2.56.1-64-bit.7z.exe
      PortableGit-2.56.1-arm64.7z.exe: https://github.com/git-for-windows/git/releases/download/v2.56.1.windows.1/PortableGit-2.56.1-arm64.7z.exe
      PortableGit-2.56.1-mingw64.7z.exe: https://github.com/git-for-windows/git/releases/download/v2.56.1.windows.1/PortableGit-2.56.1-mingw64.7z.exe
script:
  args:
    url: gh://git-for-windows/git
    gh:
      assets_jsonpath: $.assets[?(@.name =~ /.*.exe/i)]
  name: appfork-check-update
