      apache-groovy-binary-6.0.0.zip: https://groovy.jfrog.io/artifactory/dist-release-local/groovy-zips/apache-groovy-binary-6.0.0.zip
script:
  args:
    regex: /apache-groovy-binary-([\d.]+)\.zip
    autoupdate:
      apache-groovy-binary-${version}.zip: https://groovy.jfrog.io/artifactory/dist-release-local/groovy-zips/apache-groovy-binary-${version}.zip
    url: https://groovy.apache.org/download.html
  name: appfork-check-update
