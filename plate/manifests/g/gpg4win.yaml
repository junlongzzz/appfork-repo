name: Gpg4win
author: foss
homepage: https://www.gpg4win.org
description: Gpg4win (GNU Privacy Guard for Windows) is an encryption software to sign and encrypt files and emails.
logo: https://www.gpg4win.org/img/src/gpg4win_lock_white.png
categories:
  - tools
platforms:
  windows:
    version: 5.1.2
    url: https://files.gpg4win.org/gpg4win-5.1.2.exe
script:
  args:
    url: https://www.gpg4win.org/get-gpg4win.html
    regex: Download Gpg4win ([\d.]+)
    autoupdate: https://files.gpg4win.org/gpg4win-${version}.exe
  name: appfork-check-update
