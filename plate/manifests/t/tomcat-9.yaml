name: Apache Tomcat 9
author: The Apache Software Foundation
homepage: https://tomcat.apache.org
description: Implementation of the Jakarta Servlet, Jakarta Server Pages, Jakarta Expression Language, Jakarta WebSocket, Jakarta Annotations and Jakarta Authentication specifications. Tomcat 9 and earlier implement specifications developed as part of Java EE.
logo: https://tomcat.apache.org/res/images/tomcat.png
categories:
  - development
platforms:
  windows:
    version: 9.0.124
    url:
      apache-tomcat-9.0.124.exe: https://archive.apache.org/dist/tomcat/tomcat-9/v9.0.124/bin/apache-tomcat-9.0.124.exe
      apache-tomcat-9.0.124-windows-x64.zip: https://archive.apache.org/dist/tomcat/tomcat-9/v9.0.124/bin/apache-tomcat-9.0.124-windows-x64.zip
      apache-tomcat-9.0.124-windows-x86.zip: https://archive.apache.org/dist/tomcat/tomcat-9/v9.0.124/bin/apache-tomcat-9.0.124-windows-x86.zip
script:
  args:
    url: https://archive.apache.org/dist/tomcat/tomcat-9/?C=M;O=D
    regex: v(?<version>[\d.]+)/
    autoupdate:
      apache-tomcat-${version}.exe: https://archive.apache.org/dist/tomcat/tomcat-9/v${version}/bin/apache-tomcat-${version}.exe
      apache-tomcat-${version}-windows-x64.zip: https://archive.apache.org/dist/tomcat/tomcat-9/v${version}/bin/apache-tomcat-${version}-windows-x64.zip
      apache-tomcat-${version}-windows-x86.zip: https://archive.apache.org/dist/tomcat/tomcat-9/v${version}/bin/apache-tomcat-${version}-windows-x86.zip
  name: appfork-check-update
