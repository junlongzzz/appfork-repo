name: Tampermonkey
author: Jan Biniok
homepage: https://www.tampermonkey.net
description: Tampermonkey is the most popular userscript manager, with over 10 million users. It's available for Chrome, Microsoft Edge, Safari, Opera Next, and Firefox.
logo: https://avatars.githubusercontent.com/u/13335464?s=200&v=4
categories:
  - development
platforms:
  extensions:
    version: 5.5.1
    url:
      Install on FireFox: https://addons.mozilla.org/en-US/firefox/addon/tampermonkey/
      Install on Safari: https://apps.apple.com/app/apple-store/id1482490089
      Install on Chrome: https://chrome.google.com/webstore/detail/dhdgffkkebhmkfjojejmpbldmpobfkfo
      Install on Microsoft Edge: https://microsoftedge.microsoft.com/addons/detail/iikmkjmpaadaobahmlepeloendndfphd
script:
  args:
    url: https://www.tampermonkey.net/changelog.php
    regex: '>(?<version>[\d.]+)<'
    autoupdate:
      Install on FireFox: https://addons.mozilla.org/en-US/firefox/addon/tampermonkey/
      Install on Safari: https://apps.apple.com/app/apple-store/id1482490089
      Install on Chrome: https://chrome.google.com/webstore/detail/dhdgffkkebhmkfjojejmpbldmpobfkfo
      Install on Microsoft Edge: https://microsoftedge.microsoft.com/addons/detail/iikmkjmpaadaobahmlepeloendndfphd
  name: appfork-check-update
