name: Task
author: open source project
homepage: https://taskfile.dev
description: Task is a task runner / build tool that aims to be simpler and easier to use than, for example, [GNU Make](https://www.gnu.org/software/make/).
logo: https://taskfile.dev/img/logo.svg
categories:
  - development
platforms:
  windows:
    version: 3.54.0
    url:
      task_windows_amd64.zip: https://github.com/go-task/task/releases/download/v3.54.0/task_windows_amd64.zip
      task_windows_386.zip: https://github.com/go-task/task/releases/download/v3.54.0/task_windows_386.zip
      task_windows_arm64.zip: https://github.com/go-task/task/releases/download/v3.54.0/task_windows_arm64.zip
      task_windows_arm.zip: https://github.com/go-task/task/releases/download/v3.54.0/task_windows_arm.zip
script:
  args:
    url: github://go-task/task
    autoupdate:
      task_windows_amd64.zip: https://github.com/go-task/task/releases/download/v${version}/task_windows_amd64.zip
      task_windows_386.zip: https://github.com/go-task/task/releases/download/v${version}/task_windows_386.zip
      task_windows_arm64.zip: https://github.com/go-task/task/releases/download/v${version}/task_windows_arm64.zip
      task_windows_arm.zip: https://github.com/go-task/task/releases/download/v${version}/task_windows_arm.zip
  name: appfork-check-update
