name: Tailscale
author: Tailscale Inc.
homepage: https://tailscale.com
description: Tailscale a WireGuard based mesh VPN, used to connect your computers and other devices together securely without proxies.
logo: https://tailscale.com/favicon.png
categories:
  - network
platforms:
  android:
    version: 1.104.7
    url:
      - https://pkgs.tailscale.com/stable/tailscale-android-universal-1.104.7.apk
    script:
      args:
        url: https://pkgs.tailscale.com/stable/
        regex: tailscale-android-universal-(?<version>[\d.]+)\.apk
        autoupdate:
          - https://pkgs.tailscale.com/stable/tailscale-android-universal-${version}.apk
      name: appfork-check-update
  mac:
    version: 1.104.7
    url:
      - https://pkgs.tailscale.com/stable/Tailscale-1.104.7-macos.pkg
      - https://pkgs.tailscale.com/stable/Tailscale-1.104.7-macos.zip
    script:
      args:
        url: https://pkgs.tailscale.com/stable/
        regex: Tailscale-(?<version>[\d.]+)-macos\.pkg
        autoupdate:
          - https://pkgs.tailscale.com/stable/Tailscale-${version}-macos.pkg
          - https://pkgs.tailscale.com/stable/Tailscale-${version}-macos.zip
      name: appfork-check-update
  windows:
    version: 1.104.7
    url:
      - https://pkgs.tailscale.com/stable/tailscale-setup-1.104.7-amd64.msi
      - https://pkgs.tailscale.com/stable/tailscale-setup-1.104.7-arm64.msi
    script:
      args:
        url: https://pkgs.tailscale.com/stable/
        regex: tailscale-setup-(?<version>[\d.]+)-amd64\.msi
        autoupdate:
          - https://pkgs.tailscale.com/stable/tailscale-setup-${version}-amd64.msi
          - https://pkgs.tailscale.com/stable/tailscale-setup-${version}-arm64.msi
      name: appfork-check-update
