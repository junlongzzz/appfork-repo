name: Codex
author: OpenAI
homepage: https://github.com/openai/codex
description: OpenAI's open source coding agent that runs in your terminal.
logo: https://github.com/openai.png
categories:
  - development
platforms:
  windows:
    version: 0.169.0
    url:
      - https://github.com/openai/codex/releases/download/rust-v0.169.0/codex-x86_64-pc-windows-msvc.exe
      - https://github.com/openai/codex/releases/download/rust-v0.169.0/codex-aarch64-pc-windows-msvc.exe
script:
  name: appfork-check-update
  args:
    url: github://openai/codex
    regex: /releases/tag/rust-v(?<version>[\w.-]+)
    autoupdate:
      - https://github.com/openai/codex/releases/download/rust-v${version}/codex-x86_64-pc-windows-msvc.exe
      - https://github.com/openai/codex/releases/download/rust-v${version}/codex-aarch64-pc-windows-msvc.exe
