name: Cloudreve
author: Cloudreve
homepage: https://github.com/cloudreve/Cloudreve
description: Cloudreve 可以让您快速搭建起公私兼备的网盘系统。Cloudreve 在底层支持不同的云存储平台，用户在实际使用时无须关心物理存储方式。你可以使用 Cloudreve 搭建个人用网盘、文件分享系统，亦或是针对大小团体的公有云系统。
logo: https://cloudreve.org/favicon.ico
categories:
  - network
platforms:
  linux:
    version: 4.19.1
    url:
      cloudreve_4.19.1_linux_amd64.tar.gz: https://github.com/cloudreve/Cloudreve/releases/download/4.19.1/cloudreve_4.19.1_linux_amd64.tar.gz
      cloudreve_4.19.1_linux_arm64.tar.gz: https://github.com/cloudreve/Cloudreve/releases/download/4.19.1/cloudreve_4.19.1_linux_arm64.tar.gz
    script:
      args:
        autoupdate:
          cloudreve_${version}_linux_amd64.tar.gz: https://github.com/cloudreve/Cloudreve/releases/download/${version}/cloudreve_${version}_linux_amd64.tar.gz
          cloudreve_${version}_linux_arm64.tar.gz: https://github.com/cloudreve/Cloudreve/releases/download/${version}/cloudreve_${version}_linux_arm64.tar.gz
        url: gh://cloudreve/Cloudreve
      name: appfork-check-update
  windows:
    version: 4.19.1
    url:
      cloudreve_4.19.1_windows_amd64.zip: https://github.com/cloudreve/Cloudreve/releases/download/4.19.1/cloudreve_4.19.1_windows_amd64.zip
      cloudreve_4.19.1_windows_arm64.zip: https://github.com/cloudreve/Cloudreve/releases/download/4.19.1/cloudreve_4.19.1_windows_arm64.zip
    script:
      args:
        autoupdate:
          cloudreve_${version}_windows_amd64.zip: https://github.com/cloudreve/Cloudreve/releases/download/${version}/cloudreve_${version}_windows_amd64.zip
          cloudreve_${version}_windows_arm64.zip: https://github.com/cloudreve/Cloudreve/releases/download/${version}/cloudreve_${version}_windows_arm64.zip
        url: gh://cloudreve/Cloudreve
      name: appfork-check-update
