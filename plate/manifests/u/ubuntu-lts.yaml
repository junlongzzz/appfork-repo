name: Ubuntu Desktop LTS
author: Canonical
homepage: https://ubuntu.com
description: 开源的Ubuntu桌面操作系统为全球数百万的PC和笔记本电脑提供了生产力。此处为LTS（长期支持）版。
logo: https://cn.ubuntu.com/static/img/favicon.ico
categories:
  - image
platforms:
  linux:
    version: 26.04.1
    url: https://mirrors.tuna.tsinghua.edu.cn/ubuntu-releases/26.04.1/ubuntu-26.04.1-desktop-amd64.iso
script:
  args:
    regex: '>Ubuntu (?<version>[\d.]+) LTS<'
    autoupdate: https://mirrors.tuna.tsinghua.edu.cn/ubuntu-releases/${version}/ubuntu-${version}-desktop-amd64.iso
    url: https://ubuntu.com/download/desktop
  name: appfork-check-update
