name: Apache JMeter
author: Apache Software Foundation
homepage: https://jmeter.apache.org
description: Application designed to load test functional behavior and measure performance.
logo: https://jmeter.apache.org/images/logo.svg
categories:
  - development
platforms:
  other:
    version: 5.6.3
    url: https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.zip
script:
  args:
    autoupdate: https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${version}.zip
    url: https://jmeter.apache.org/changes.html
    regex: '>Version (?<version>[\d.]+)'
  name: appfork-check-update
