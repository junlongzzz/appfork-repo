name: Nacos
author: Alibaba Open Source
homepage: https://nacos.io
description: Nacos /nɑ:kəʊs/ 是 Dynamic Naming and Configuration Service的首字母简称，一个更易于构建云原生应用的动态服务发现、配置管理和服务管理平台。
categories:
  - development
platforms:
  other:
    version: 3.3.1
    url:
      - https://github.com/alibaba/nacos/releases/download/3.3.1/nacos-server-3.3.1.tar.gz
      - https://github.com/alibaba/nacos/releases/download/3.3.1/nacos-server-3.3.1.zip
script:
  args:
    autoupdate:
      - https://github.com/alibaba/nacos/releases/download/${version}/nacos-server-${version}.tar.gz
      - https://github.com/alibaba/nacos/releases/download/${version}/nacos-server-${version}.zip
    url: gh://alibaba/nacos
  name: appfork-check-update
