name: Python
author: Python Software Foundation
homepage: https://www.python.org
description: Python is a programming language that lets you work quickly and integrate systems more effectively. You can also choose to install <a href='https://www.anaconda.com' target='_blank'>Anaconda</a>.
logo: https://docs.python.org/3/_static/py.svg
categories:
  - development
platforms:
  windows:
    version: 3.15.2
    url:
      Installer (32-bit): https://www.python.org/ftp/python/3.15.2/python-3.15.2.exe
      Installer (64-bit): https://www.python.org/ftp/python/3.15.2/python-3.15.2-amd64.exe
      Installer (ARM64): https://www.python.org/ftp/python/3.15.2/python-3.15.2-arm64.exe
script:
  args:
    regex: Latest Python \d+ Release - Python ([\d.]+)
    autoupdate:
      Installer (32-bit): https://www.python.org/ftp/python/${version}/python-${version}.exe
      Installer (64-bit): https://www.python.org/ftp/python/${version}/python-${version}-amd64.exe
      Installer (ARM64): https://www.python.org/ftp/python/${version}/python-${version}-arm64.exe
    url: https://www.python.org/downloads/windows/
  name: appfork-check-update
